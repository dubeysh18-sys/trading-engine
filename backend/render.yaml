services:
  - type: web
    name: trading-engine-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: UPSTOX_ACCESS_TOKEN
        sync: false          # Set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-netlify-app.netlify.app
      - key: APP_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        sync: false   # Set to https://trading-engine-58hz.onrender.com (no trailing slash)
